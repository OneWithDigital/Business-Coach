# Standalone compose project for the Business Formation Coach.
# Deliberately separate from /root/automation-stack/docker-compose.yml —
# this does not modify or restart anything in that stack. It joins two
# already-existing external networks: automation_network (so
# nginx-proxy-manager can reach it) and database_network (so it can
# reach the existing `postgres` container). See DEPLOYMENT.md.

services:
  app:
    build: .
    container_name: business-coach
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - automation-stack_automation_network
      - automation-stack_database_network
    expose:
      - "3000"

networks:
  automation-stack_automation_network:
    external: true
  automation-stack_database_network:
    external: true
